version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  migrate:
    build: .
    command: >
      sh -c "
        until pg_isready -h db -p 5432 -U postgres; do sleep 1; done &&
        alembic upgrade head
      "
    depends_on:
      - db

  web:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - migrate
    ports:
      - "8000:8000"
