events {}

http {
  server {
    listen 80;

    # Чтобы HLS нормально играл в браузере/с другого порта (8000 -> 8080)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # MIME types именно для HLS
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }

    # OPTIONS (на всякий)
    if ($request_method = OPTIONS) {
      return 204;
    }

    # =========================
    # HLS
    # public:  /hls/{id}/master.m3u8  OR  /hls/v{id}/master.m3u8
    # disk:    /app/uploads/hls/v{id}/master.m3u8
    # =========================
    location ~ ^/hls/(?:v)?(?<vid>\d+)/(.*)$ {
      alias /app/uploads/hls/v$vid/$2;

      # Если файла нет — быстро 404 без “странных” попыток
      try_files $uri =404;

      # Плейлист часто обновляется — короткий кэш
      if ($request_uri ~* \.m3u8$) {
        add_header Cache-Control "public, max-age=10" always;
      }

      # Сегменты можно кэшировать агрессивнее (под твой кейс)
      if ($request_uri ~* \.ts$) {
        add_header Cache-Control "public, max-age=300, immutable" always;
      }

      # Range важен для некоторых клиентов
      add_header Accept-Ranges "bytes" always;
    }

    # (опционально) Thumbnails, если решишь раздавать их через nginx
    location /thumb/ {
      alias /app/uploads/thumbnails/;
      add_header Cache-Control "public, max-age=300" always;
    }
  }
}