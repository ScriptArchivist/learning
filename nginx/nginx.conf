events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Cache policy by extension
  map $uri $live_cache_control {
    default "no-cache";
    ~*\.m3u8$ "no-cache";
    ~*\.ts$   "public, max-age=30";
  }

  map $uri $vod_cache_control {
    default "public, max-age=60";
    ~*\.m3u8$ "public, max-age=10";
    ~*\.ts$   "public, max-age=300, immutable";
  }

  server {
    listen 80;

    # ВСЕ файлы лежат тут
    root /app/uploads;

    absolute_redirect off;
    port_in_redirect off;

    # CORS для HLS/Range
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # OPTIONS (preflight)
    if ($request_method = OPTIONS) { return 204; }

    # =========================
    # LIVE HLS
    # public: /live/{stream_key}/...
    # disk:   /app/uploads/live/{stream_key}/...
    # =========================
    location ^~ /live/ {
      add_header Cache-Control $live_cache_control always;
      add_header Accept-Ranges "bytes" always;
      try_files $uri =404;
    }

    # =========================
    # VOD HLS (CANONICAL)
    # public: /hls/v{id}/... -> disk: /app/uploads/hls/v{id}/...
    # =========================
    location ^~ /hls/v {
      add_header Cache-Control $vod_cache_control always;
      add_header Accept-Ranges "bytes" always;
      try_files $uri =404;
    }

    # =========================
    # VOD HLS (LEGACY ALIAS)
    # public: /hls/{id}/... -> 301 -> /hls/v{id}/...
    # =========================
    location ~ ^/hls/(\d+)/(.*)$ {
      return 301 /hls/v$1/$2;
    }

    # =========================
    # Thumbnails
    # public: /thumb/... -> disk: /app/uploads/thumbnails/...
    # =========================
    location ^~ /thumb/ {
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri =404;
    }
  }
}