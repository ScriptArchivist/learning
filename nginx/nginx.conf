events {}

http {
  # MIME types for HLS
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
  }

  # Cache policy by extension (без if в location)
  map $uri $live_cache_control {
    default "no-cache";
    ~*\.m3u8$ "no-cache";
    ~*\.ts$   "public, max-age=30";
  }

  map $uri $vod_cache_control {
    default "public, max-age=60";
    ~*\.m3u8$ "public, max-age=10";
    ~*\.ts$   "public, max-age=300, immutable";
  }

  server {
    listen 80;
    add_header Accept-Ranges "bytes" always;

    # ВАЖНО: не терять порт при редиректах
    absolute_redirect off;
    port_in_redirect off;

    # CORS для HLS/Range
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # OPTIONS (preflight)
    if ($request_method = OPTIONS) { return 204; }

    # =========================
    # LIVE HLS (MVP)
    # public: /live/{stream_key}/master.m3u8
    # disk:   /app/uploads/live/{stream_key}/master.m3u8
    # =========================
    location /live/ {
      alias /app/uploads/live/;

      add_header Cache-Control $live_cache_control always;
    }

    # =========================
    # VOD HLS
    # public: /hls/{id}/master.m3u8  OR  /hls/v{id}/master.m3u8
    # disk:   /app/uploads/hls/v{id}/...
    # =========================
    location ~ ^/hls/(?:v)?(?<vid>\d+)/(?:)(?<rest>.+)$ {
      alias /app/uploads/hls/v$vid/$rest;

      add_header Cache-Control $vod_cache_control always;
      add_header Accept-Ranges "bytes" always;

      try_files $uri =404;
    }

    # =========================
    # Thumbnails
    # public: /thumb/v{id}/thumb.jpg  (или как у тебя устроено)
    # disk:   /app/uploads/thumbnails/...
    # =========================
    location /thumb/ {
      alias /app/uploads/thumbnails/;
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri =404;
    }
  }
}