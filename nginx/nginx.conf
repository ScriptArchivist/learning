events {}

http {
  server {
    listen 80;

    # ВАЖНО: не терять порт при редиректах
    absolute_redirect off;
    port_in_redirect off;

    # Чтобы HLS нормально играл в браузере/с другого порта (8000 -> 8080)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # MIME types именно для HLS
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }

    # OPTIONS (на всякий случай)
    if ($request_method = OPTIONS) {
      return 204;
    }

    # =========================
    # LIVE HLS (MVP)
    # public: /live/{stream_key}/master.m3u8
    # disk:   /app/uploads/live/{stream_key}/master.m3u8
    # =========================
    location /live/ {
      alias /app/uploads/live/;

      # плейлист обновляется часто — без кэша
      if ($request_uri ~* \.m3u8$) {
        add_header Cache-Control "no-cache" always;
      }

      # сегменты можно кэшировать чуть-чуть
      if ($request_uri ~* \.ts$) {
        add_header Cache-Control "public, max-age=30" always;
      }

      add_header Accept-Ranges "bytes" always;
    }

    # =========================
    # VOD HLS
    # public:  /hls/{id}/master.m3u8  OR  /hls/v{id}/master.m3u8
    # disk:    /app/uploads/hls/v{id}/master.m3u8
    # =========================
    location ~ ^/hls/(?:v)?(?<vid>\d+)/(?:)(?<rest>.+)$ {
      alias /app/uploads/hls/v$vid/$rest;

      # Плейлист часто обновляется — короткий кэш
      if ($request_uri ~* \.m3u8$) {
        add_header Cache-Control "public, max-age=10" always;
      }

      # Сегменты можно кэшировать агрессивнее
      if ($request_uri ~* \.ts$) {
        add_header Cache-Control "public, max-age=300, immutable" always;
      }

      add_header Accept-Ranges "bytes" always;
    }

    # =========================
    # Thumbnails (опционально)
    # =========================
    location /thumb/ {
      alias /app/uploads/thumbnails/;
      add_header Cache-Control "public, max-age=300" always;
    }
  }
}