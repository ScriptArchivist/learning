worker_processes  1;

error_log  /var/log/nginx/error.log  info;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  server {
    listen 80;

    # Проба/health
    location /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # ===== LIVE HLS =====
    # URL:  http://localhost:8080/live/<stream_key>/master.m3u8
    # PATH: /app/uploads/live/<stream_key>/master.m3u8
    location ^~ /live/ {
      alias /app/uploads/live/;

      # важно для HLS
      types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                    ts;
      }

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;

      # (не обязательно, но удобно для тестов в браузере)
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;

      if ($request_method = OPTIONS) {
        return 204;
      }

      try_files $uri =404;
    }

    # ===== VOD HLS (если у тебя есть /hls/ как общий префикс) =====
    # URL:  http://localhost:8080/hls/....
    # PATH: /app/uploads/hls/....
    location ^~ /hls/ {
      alias /app/uploads/hls/;

      types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                    ts;
      }

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;

      if ($request_method = OPTIONS) {
        return 204;
      }

      try_files $uri =404;
    }
  }
}