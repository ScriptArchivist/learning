global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: fastapi-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8000
          - upload-service:8000
          - video-api:8000
          - live-api:8000
          - identity-service:8000

  - job_name: background-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - processing-worker:9100
          - outbox-publisher:9100
          - video-events-consumer:9100
          - live-cleaner:9100