apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      containers:
        - name: outbox-publisher
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting outbox-publisher..." &&
              python -m src.outbox_publisher
          env:
            - name: SERVICE_NAME
              value: outbox-publisher

            - name: METRICS_PORT
              value: "9100"

            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: RABBIT_URL
              value: amqp://guest:guest@rabbitmq:5672/

            - name: OUTBOX_BATCH_SIZE
              value: "50"

            - name: OUTBOX_POLL_INTERVAL
              value: "0.5"

            - name: OUTBOX_LEADER_LOCK_KEY
              value: "424242"

          ports:
            - containerPort: 9100
              name: metrics