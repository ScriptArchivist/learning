apiVersion: v1
kind: Service
metadata:
  name: outbox-publisher-metrics
spec:
  selector:
    app: outbox-publisher
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for postgres-master:5432..."
              until nc -z postgres-master 5432; do
                echo "postgres-master:5432 not ready yet"
                sleep 2
              done

              echo "Waiting for rabbitmq:5672..."
              until nc -z rabbitmq 5672; do
                echo "rabbitmq:5672 not ready yet"
                sleep 2
              done

              echo "All dependencies are ready"
      containers:
        - name: outbox-publisher
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting outbox-publisher..." &&
              python -m src.outbox_publisher
          env:
            - name: SERVICE_NAME
              value: outbox-publisher
            - name: METRICS_PORT
              value: "9100"
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: RABBIT_URL
              value: amqp://app:app@rabbitmq:5672/
            - name: OUTBOX_BATCH_SIZE
              value: "50"
            - name: OUTBOX_POLL_INTERVAL
              value: "0.5"
            - name: OUTBOX_LEADER_LOCK_KEY
              value: "424242"
          ports:
            - containerPort: 9100
              name: metrics