apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for postgres master..." &&
              sleep 10 &&
              alembic upgrade head
          env:
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app