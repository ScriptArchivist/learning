apiVersion: v1
kind: Service
metadata:
  name: upload-service
spec:
  type: NodePort
  selector:
    app: upload-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30003

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: fix-uploads-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads
              chown -R 10001:10001 /app/uploads
              chmod -R ug+rwX /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: upload-service
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting upload-service..." &&
              uvicorn src.upload_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          env:
            - name: SERVICE_NAME
              value: upload-service
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: secret_key
              value: super-secret-key-change-me
            - name: access_token_expire_minutes
              value: "30"
            - name: STORAGE_PATH
              value: /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc