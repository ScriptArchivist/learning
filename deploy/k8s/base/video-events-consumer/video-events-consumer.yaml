apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-events-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-events-consumer
  template:
    metadata:
      labels:
        app: video-events-consumer
    spec:
      containers:
        - name: video-events-consumer
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting video-events-consumer..." &&
              python -m src.video_events_consumer
          env:
            - name: SERVICE_NAME
              value: video-events-consumer

            - name: METRICS_PORT
              value: "9100"

            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: RABBIT_URL
              value: amqp://guest:guest@rabbitmq:5672/

            - name: RABBIT_EVENTS_EXCHANGE
              value: video.events.x

            - name: RABBIT_EVENTS_QUEUE
              value: events.q

            - name: RABBIT_EVENTS_ROUTING_KEY
              value: video.events

          ports:
            - containerPort: 9100
              name: metrics