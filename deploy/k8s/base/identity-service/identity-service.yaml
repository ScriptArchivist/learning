apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  type: NodePort
  selector:
    app: identity-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30002

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting identity-service..." &&
              uvicorn identity.src.main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          env:
            - name: SERVICE_NAME
              value: identity-service
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app
            - name: secret_key
              value: changeme
            - name: access_token_expire_minutes
              value: "30"