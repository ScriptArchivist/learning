apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-cleaner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-cleaner
  template:
    metadata:
      labels:
        app: live-cleaner
    spec:
      containers:
        - name: live-cleaner
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting live-cleaner..." &&
              python -m src.live_ttl_cleaner
          env:
            - name: SERVICE_NAME
              value: live-cleaner

            - name: METRICS_PORT
              value: "9100"

            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: LIVE_TTL_INTERVAL_SECONDS
              value: "10"

            - name: LIVE_TTL_BATCH_SIZE
              value: "100"

            - name: LOG_LEVEL
              value: "INFO"

            - name: STORAGE_PATH
              value: /app/uploads
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc