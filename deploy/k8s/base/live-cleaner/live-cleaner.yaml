apiVersion: v1
kind: Service
metadata:
  name: live-cleaner-metrics
spec:
  selector:
    app: live-cleaner
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-cleaner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-cleaner
  template:
    metadata:
      labels:
        app: live-cleaner
    spec:
      initContainers:
        - name: prepare-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads /app/uploads/live /app/uploads/hls /app/uploads/original /app/uploads/thumbs
              chmod 777 /app/uploads || true
              chmod 777 /app/uploads/live || true
              chmod 777 /app/uploads/hls || true
              chmod 777 /app/uploads/original || true
              chmod 777 /app/uploads/thumbs || true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: live-cleaner
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting live-cleaner..." &&
              python -m src.live_ttl_cleaner
          env:
            - name: SERVICE_NAME
              value: live-cleaner
            - name: METRICS_PORT
              value: "9100"
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: STORAGE_PATH
              value: /app/uploads
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc