apiVersion: v1
kind: Service
metadata:
  name: video-api
spec:
  type: NodePort
  selector:
    app: video-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30004

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-api
  template:
    metadata:
      labels:
        app: video-api
    spec:
      containers:
        - name: video-api
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting video-api..." &&
              uvicorn src.video_api_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          env:
            - name: SERVICE_NAME
              value: video-api
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app
            - name: secret_key
              value: changeme
            - name: access_token_expire_minutes
              value: "30"
            - name: PUBLIC_HOST
              value: "127.0.0.1"
            - name: PUBLIC_HTTP_SCHEME
              value: "http"
            - name: PUBLIC_HTTP_PORT
              value: "8080"
            - name: PUBLIC_RTMP_PORT
              value: "1935"
            - name: DELIVERY_MODE
              value: "url"
            - name: DELIVERY_PUBLIC_BASE_URL
              value: "http://127.0.0.1:8080"
            - name: DELIVERY_BASE_URL
              value: "http://origin"