apiVersion: v1
kind: Service
metadata:
  name: processing-worker-metrics
spec:
  selector:
    app: processing-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-worker
  template:
    metadata:
      labels:
        app: processing-worker
    spec:
      initContainers:
        - name: prepare-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads /app/uploads/live /app/uploads/hls /app/uploads/original /app/uploads/thumbs
              chmod 777 /app/uploads || true
              chmod 777 /app/uploads/live || true
              chmod 777 /app/uploads/hls || true
              chmod 777 /app/uploads/original || true
              chmod 777 /app/uploads/thumbs || true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for postgres-master:5432..."
              until nc -z postgres-master 5432; do
                echo "postgres-master:5432 not ready yet"
                sleep 2
              done

              echo "Waiting for rabbitmq:5672..."
              until nc -z rabbitmq 5672; do
                echo "rabbitmq:5672 not ready yet"
                sleep 2
              done

              echo "Waiting for redis:6379..."
              until nc -z redis 6379; do
                echo "redis:6379 not ready yet"
                sleep 2
              done

              echo "All dependencies are ready"
      containers:
        - name: processing-worker
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting processing-worker..." &&
              python -m src.worker
          env:
            - name: SERVICE_NAME
              value: processing-worker
            - name: METRICS_PORT
              value: "9100"
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: RABBIT_URL
              value: amqp://app:app@rabbitmq:5672/
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: VIDEO_LOCK_TTL_SECONDS
              value: "3600"
            - name: STORAGE_PATH
              value: /app/uploads
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc