apiVersion: v1
kind: ConfigMap
metadata:
  name: origin-nginx-config
data:
  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile        on;
      keepalive_timeout  65;

      server {
        listen 80;
        server_name _;

        root /app/uploads;
        client_max_body_size 1024m;

        location / {
          autoindex on;
          try_files $uri $uri/ =404;
        }
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: origin
spec:
  selector:
    app: origin
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: origin
  template:
    metadata:
      labels:
        app: origin
    spec:
      containers:
        - name: origin
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: uploads
              mountPath: /app/uploads
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: origin-nginx-config
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc