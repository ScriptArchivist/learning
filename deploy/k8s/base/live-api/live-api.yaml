apiVersion: v1
kind: Service
metadata:
  name: live-api
spec:
  type: NodePort
  selector:
    app: live-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30005

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-api
  template:
    metadata:
      labels:
        app: live-api
    spec:
      initContainers:
        - name: fix-uploads-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 10001:10001 /app/uploads && chmod -R 775 /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: live-api
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting live-api..." &&
              uvicorn src.live_api_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          env:
            - name: SERVICE_NAME
              value: live-api
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: secret_key
              value: super-secret-key-change-me
            - name: access_token_expire_minutes
              value: "30"
            - name: PUBLIC_HOST
              value: "192.168.49.2"
            - name: PUBLIC_HTTP_SCHEME
              value: "http"
            - name: PUBLIC_HTTP_PORT
              value: "30006"
            - name: PUBLIC_RTMP_PORT
              value: "31935"
            - name: LIVE_RTMP_URL_TEMPLATE
              value: rtmp://192.168.49.2:31935/live/{stream_key}
            - name: LIVE_HLS_URL_TEMPLATE
              value: http://192.168.49.2:30006/live/{stream_key}/master.m3u8
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc