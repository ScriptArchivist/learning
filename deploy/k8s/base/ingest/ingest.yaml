apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-nginx-config
data:
  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 1024;
    }

    rtmp_auto_push on;
    rtmp_auto_push_reconnect 1s;

    rtmp {
      server {
        listen 1935;
        chunk_size 4096;

        application live {
          live on;
          record off;

          exec_publish /opt/scripts/on_publish.sh $name;
          exec_publish_done /opt/scripts/on_publish_done.sh $name;
        }
      }
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile        on;
      keepalive_timeout  65;

      server {
        listen 8080;
        server_name _;

        location /stat {
          rtmp_stat all;
          rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
          root /usr/local/nginx/html;
        }
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-scripts
data:
  on_publish.sh: |
    #!/bin/sh
    set -eu
    exec /opt/transcode.sh "$1"

  on_publish_done.sh: |
    #!/bin/sh
    set -eu
    exit 0

  transcode.sh: |
    #!/bin/sh
    set -eu

    STREAM_KEY="${1:-unknown}"

    mkdir -p "/app/uploads/live/${STREAM_KEY}"

    ffmpeg -i "rtmp://127.0.0.1:1935/live/${STREAM_KEY}" \
      -c:v libx264 \
      -c:a aac \
      -f hls \
      -hls_time 2 \
      -hls_list_size 6 \
      -hls_flags delete_segments+append_list \
      "/app/uploads/live/${STREAM_KEY}/master.m3u8"

---
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector:
    app: ingest
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: learning-app-ingest:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1935
              name: rtmp
            - containerPort: 8080
              name: http
          env:
            - name: RTMP_HOST
              value: "127.0.0.1"
            - name: RTMP_PORT
              value: "1935"
            - name: MAX_ATTEMPTS
              value: "20"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: scripts
              mountPath: /opt/scripts/on_publish.sh
              subPath: on_publish.sh
            - name: scripts
              mountPath: /opt/scripts/on_publish_done.sh
              subPath: on_publish_done.sh
            - name: scripts
              mountPath: /opt/transcode.sh
              subPath: transcode.sh
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: nginx-config
          configMap:
            name: ingest-nginx-config
            defaultMode: 0755
        - name: scripts
          configMap:
            name: ingest-scripts
            defaultMode: 0755