apiVersion: batch/v1
kind: Job
metadata:
  name: dlq-replayer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dlq-replayer
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for postgres-master:5432..."
              until nc -z postgres-master 5432; do
                echo "postgres-master is unavailable, sleeping..."
                sleep 2
              done
              echo "postgres-master is ready"
      containers:
        - name: dlq-replayer
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting dlq-replayer..." &&
              python -m src.dlq_replayer
          env:
            - name: SERVICE_NAME
              value: dlq-replayer
            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres-master:5432/app
            - name: DLQ_REPLAY_LIMIT
              value: "200"
            - name: DLQ_RESET_ATTEMPTS
              value: "1"