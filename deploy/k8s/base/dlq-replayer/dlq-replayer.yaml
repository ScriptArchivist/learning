apiVersion: batch/v1
kind: Job
metadata:
  name: dlq-replayer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dlq-replayer
    spec:
      restartPolicy: Never
      containers:
        - name: dlq-replayer
          image: learning-app-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting dlq-replayer..." &&
              python -m src.dlq_replayer
          env:
            - name: SERVICE_NAME
              value: dlq-replayer

            - name: database_write_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: database_read_url
              value: postgresql+psycopg://postgres:postgres@postgres:5432/app

            - name: DLQ_REPLAY_LIMIT
              value: "200"

            - name: DLQ_RESET_ATTEMPTS
              value: "1"