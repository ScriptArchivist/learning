apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-platform-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
          - path: /hls
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
          - path: /thumb
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3001