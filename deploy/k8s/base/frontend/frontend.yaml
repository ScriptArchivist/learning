apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: learning-app-frontend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting frontend..." &&
              npm ci &&
              npm run dev -- -p 3001
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://web:8000
          ports:
            - containerPort: 3001