apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: learning-app-frontend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting frontend..." &&
              npm ci &&
              npm run dev -- -p 3001
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://192.168.1.12
            - name: NEXT_PUBLIC_VIDEO_API_URL
              value: http://192.168.1.12/api/v1
            - name: NEXT_PUBLIC_UPLOAD_API_URL
              value: http://192.168.1.12/api/v1
            - name: NEXT_PUBLIC_IDENTITY_API_URL
              value: http://192.168.1.12
            - name: NEXT_PUBLIC_LIVE_API_URL
              value: http://192.168.1.12
          ports:
            - containerPort: 3001
              name: http
          volumeMounts:
            - name: frontend-next-config
              mountPath: /app/next.config.ts
              subPath: next.config.ts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: frontend-next-config
          configMap:
            name: frontend-next-config
