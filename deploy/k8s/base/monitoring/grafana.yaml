apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  uid: prometheus\n\
    \  type: prometheus\n  access: proxy\n  url: http://prometheus:9090\n  isDefault:\
    \ true\n  editable: true\n- name: Loki\n  uid: loki\n  type: loki\n  access: proxy\n\
    \  url: http://loki:3100\n  editable: true\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: grafana
data:
  dashboards.yml: "apiVersion: 1\nproviders:\n- name: Video Platform K8s\n  orgId:\
    \ 1\n  folder: Video Platform K8s\n  type: file\n  disableDeletion: false\n  editable:\
    \ true\n  updateIntervalSeconds: 30\n  options:\n    path: /etc/grafana/provisioning/dashboards/json\n"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          subPath: datasources.yml
        - name: provider
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          subPath: dashboards.yml
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards/json
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards