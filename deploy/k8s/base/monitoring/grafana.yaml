apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          subPath: datasources.yml
        - name: provider
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          subPath: dashboards.yml
        - name: overview
          mountPath: /etc/grafana/provisioning/dashboards/json/video-platform-k8s-overview.json
          subPath: video-platform-k8s-overview.json
        - name: api
          mountPath: /etc/grafana/provisioning/dashboards/json/video-platform-k8s-api.json
          subPath: video-platform-k8s-api.json
        - name: pipeline
          mountPath: /etc/grafana/provisioning/dashboards/json/video-platform-k8s-pipeline.json
          subPath: video-platform-k8s-pipeline.json
        - name: slo
          mountPath: /etc/grafana/provisioning/dashboards/json/video-platform-k8s-slo.json
          subPath: video-platform-k8s-slo.json
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: provider
        configMap:
          name: grafana-dashboard-provider
      - name: overview
        configMap:
          name: grafana-dashboard-overview
      - name: api
        configMap:
          name: grafana-dashboard-api
      - name: pipeline
        configMap:
          name: grafana-dashboard-pipeline
      - name: slo
        configMap:
          name: grafana-dashboard-slo
