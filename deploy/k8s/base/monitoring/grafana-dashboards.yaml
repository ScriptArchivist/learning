          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "targets": [
            {
              "expr": "(sum(rate(app_http_requests_total{service=~\"web|upload-service|video-api|live-api|identity-service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(app_http_requests_total{service=~\"web|upload-service|video-api|live-api|identity-service\"}[5m])), 0.001)) or vector(0)",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
