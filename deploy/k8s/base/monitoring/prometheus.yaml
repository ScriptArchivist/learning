apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - prometheus:9090

      - job_name: web
        metrics_path: /metrics
        static_configs:
          - targets:
              - web:8000

      - job_name: identity-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - identity-service:8000

      - job_name: upload-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - upload-service:8000

      - job_name: video-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - video-api:8000

      - job_name: live-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - live-api:8000

      - job_name: processing-worker
        metrics_path: /metrics
        static_configs:
          - targets:
              - processing-worker-metrics:9100

      - job_name: outbox-publisher
        metrics_path: /metrics
        static_configs:
          - targets:
              - outbox-publisher-metrics:9100

      - job_name: video-events-consumer
        metrics_path: /metrics
        static_configs:
          - targets:
              - video-events-consumer-metrics:9100

      - job_name: live-cleaner
        metrics_path: /metrics
        static_configs:
          - targets:
              - live-cleaner-metrics:9100

      - job_name: rabbitmq
        static_configs:
          - targets:
              - rabbitmq:15692

      - job_name: postgres-exporter-master
        static_configs:
          - targets:
              - postgres-exporter-master:9187

      - job_name: postgres-exporter-replica
        static_configs:
          - targets:
              - postgres-exporter-replica:9187

      - job_name: node-exporter
        static_configs:
          - targets:
              - node-exporter:9100

      - job_name: cadvisor
        static_configs:
          - targets:
              - cadvisor:8080

      - job_name: grafana
        metrics_path: /metrics
        static_configs:
          - targets:
              - grafana:3000

      - job_name: loki
        metrics_path: /metrics
        static_configs:
          - targets:
              - loki:3100

      - job_name: alertmanager
        metrics_path: /metrics
        static_configs:
          - targets:
              - alertmanager:9093

      - job_name: promtail
        metrics_path: /metrics
        static_configs:
          - targets:
              - promtail:9080

      - job_name: frontend
        metrics_path: /api/metrics
        static_configs:
          - targets:
              - frontend:3001
  alerts.yml: |
    groups:
      - name: service-health
        rules:
          - alert: ServiceDownCritical
            expr: up{job=~"web|upload-service|video-api|live-api|identity-service|processing-worker|outbox-publisher|video-events-consumer|rabbitmq|prometheus|grafana|loki|alertmanager"} == 0
            for: 1m
            labels:
              severity: critical
              category: availability
            annotations:
              summary: "Critical service down: {{ $labels.job }}"
              description: "Critical target {{ $labels.instance }} for job {{ $labels.job }} has been down for 1 minute."

          - alert: ServiceDownWarning
            expr: up{job=~"live-cleaner|promtail|node-exporter|cadvisor|postgres-exporter-master|postgres-exporter-replica|frontend"} == 0
            for: 2m
            labels:
              severity: warning
              category: availability
            annotations:
              summary: "Supporting service down: {{ $labels.job }}"
              description: "Supporting target {{ $labels.instance }} for job {{ $labels.job }} has been down for 2 minutes."

      - name: api-symptoms
        rules:
          - alert: ApiHigh5xxRate
            expr: |
              (
                sum by (service) (rate(app_http_requests_total{service=~"web|upload-service|video-api|live-api|identity-service",status=~"5.."}[5m]))
                /
                clamp_min(sum by (service) (rate(app_http_requests_total{service=~"web|upload-service|video-api|live-api|identity-service"}[5m])), 0.001)
              ) > 0.05
            for: 5m
            labels:
              severity: critical
              category: api
            annotations:
              summary: "High 5xx rate: {{ $labels.service }}"
              description: "5xx ratio is above 5% for 5 minutes."

          - alert: ApiHighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum by (service, path, le) (
                  rate(app_http_request_duration_seconds_bucket{service=~"web|upload-service|video-api|live-api|identity-service"}[5m])
                )
              ) > 1.0
            for: 5m
            labels:
              severity: warning
              category: api
            annotations:
              summary: "High API latency: {{ $labels.service }}"
              description: "p95 latency on {{ $labels.path }} is above 1s for 5 minutes."

      - name: worker-pipeline
        rules:
          - alert: WorkerFailuresDetected
            expr: increase(app_worker_job_failures_total{service="processing-worker"}[10m]) > 0
            for: 0m
            labels:
              severity: warning
              category: worker
            annotations:
              summary: "Worker failures detected"
              description: "processing-worker had one or more failed jobs in the last 10 minutes."

          - alert: OutboxFailedPresent
            expr: app_outbox_failed{service="outbox-publisher"} > 0
            for: 1m
            labels:
              severity: critical
              category: outbox
            annotations:
              summary: "Outbox has failed events"
              description: "There are FAILED records in outbox for more than 1 minute."

          - alert: RabbitQueueBacklog
            expr: rabbitmq_queue_messages_ready > 10
            for: 3m
            labels:
              severity: warning
              category: queue
            annotations:
              summary: "RabbitMQ backlog"
              description: "Queue {{ $labels.queue }} has more than 10 ready messages for 3 minutes."

      - name: database-and-infra
        rules:
          - alert: ReplicaReadDrift
            expr: app_db_replica_row_count_difference{service="video-api",entity="videos"} > 0
            for: 3m
            labels:
              severity: warning
              category: database
            annotations:
              summary: "Replica drift detected"
              description: "Master/replica row-count drift for videos persists for 3 minutes."

          - alert: HighNodeCpu
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels:
              severity: warning
              category: infra
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is above 85% for 10 minutes on {{ $labels.instance }}."

          - alert: HighNodeMemory
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 10m
            labels:
              severity: warning
              category: infra
            annotations:
              summary: "High memory usage"
              description: "Memory usage is above 85% for 10 minutes on {{ $labels.instance }}."
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
