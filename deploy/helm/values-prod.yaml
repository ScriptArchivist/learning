global:
  environment: prod
  namespace: video-platform
  domain: video.example.com
  publicBaseUrl: https://video.example.com
  mediaBaseUrl: https://video.example.com
  imagePullPolicy: IfNotPresent

replicaCount: 2

image:
  backend:
    repository: registry.example.com/video-platform/backend
    tag: "REPLACE_ME"
    pullPolicy: IfNotPresent

  worker:
    repository: registry.example.com/video-platform/worker
    tag: "REPLACE_ME"
    pullPolicy: IfNotPresent

  frontend:
    repository: registry.example.com/video-platform/frontend
    tag: "REPLACE_ME"
    pullPolicy: IfNotPresent

  postgres:
    repository: bitnami/postgresql
    tag: "16.4.0"

  rabbitmq:
    repository: rabbitmq
    tag: "3-management"

  redis:
    repository: redis
    tag: "7-alpine"

  grafana:
    repository: grafana/grafana
    tag: "10.4.2"

  prometheus:
    repository: prom/prometheus
    tag: "v2.51.2"

  alertmanager:
    repository: prom/alertmanager
    tag: "v0.27.0"

  loki:
    repository: grafana/loki
    tag: "2.9.8"

  promtail:
    repository: grafana/promtail
    tag: "2.9.8"

  nginx:
    repository: nginx
    tag: "1.25-alpine"

service:
  type: ClusterIP

app:
  accessTokenExpireMinutes: 30
  deliveryMode: url
  deliveryBaseUrl: http://origin:80
  hlsPublicPathPrefix: hls
  storageType: local
  storagePath: /app/uploads

ingress:
  enabled: true
  className: nginx
  host: video.example.com
  tls:
    enabled: true
    secretName: video-platform-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

secrets:
  create: false
  appSecretName: video-platform-app-secret
  postgresSecretName: postgres-secret
  rabbitmqSecretName: rabbitmq-secret
  grafanaSecretName: grafana-secret

postgres:
  host: postgres-master
  port: 5432
  db: app
  user: postgres
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""

rabbitmq:
  host: rabbitmq
  port: 5672
  user: video
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

redis:
  host: redis
  port: 6379

storage:
  pvcName: uploads-pvc
  size: 50Gi
  storageClassName: ""

grafana:
  adminUser: admin
  domain: video.example.com
  rootUrl: https://video.example.com/grafana/
  csrfTrustedOrigins: https://video.example.com
  anonymous:
    enabled: false
    orgRole: Viewer
  loginForm:
    disabled: false

prometheus:
  retention: 7d

loki:
  retention: 168h