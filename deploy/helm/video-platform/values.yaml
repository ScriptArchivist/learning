global:
  environment: local
  namespace: video-platform
  domain: video-platform.local
  publicBaseUrl: http://video-platform.local
  mediaBaseUrl: http://video-platform.local
  imagePullPolicy: IfNotPresent

image:
  backend:
    repository: learning-app-backend
    tag: local
    pullPolicy: IfNotPresent

  worker:
    repository: learning-app-worker
    tag: local
    pullPolicy: IfNotPresent

  frontend:
    repository: learning-app-frontend
    tag: local
    pullPolicy: IfNotPresent

  postgres:
    repository: bitnami/postgresql
    tag: "16.4.0"

  rabbitmq:
    repository: rabbitmq
    tag: "3-management"

  redis:
    repository: redis
    tag: "7-alpine"

  grafana:
    repository: grafana/grafana
    tag: "10.4.2"

  prometheus:
    repository: prom/prometheus
    tag: "v2.51.2"

  alertmanager:
    repository: prom/alertmanager
    tag: "v0.27.0"

  loki:
    repository: grafana/loki
    tag: "2.9.8"

  promtail:
    repository: grafana/promtail
    tag: "2.9.8"

  nginx:
    repository: nginx
    tag: "1.25-alpine"

replicaCount: 1

service:
  type: ClusterIP

app:
  accessTokenExpireMinutes: 30
  deliveryMode: url
  deliveryBaseUrl: http://origin:80
  hlsPublicPathPrefix: hls
  storageType: local
  storagePath: /app/uploads

  s3:
    endpointUrl: ""
    regionName: ru-1
    bucket: ""
    verifySsl: true

ingress:
  enabled: true
  className: traefik
  host: video-platform.local
  tls:
    enabled: false
    secretName: video-platform-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

secrets:
  create: true
  appSecretName: video-platform-app-secret
  postgresSecretName: postgres-secret
  rabbitmqSecretName: rabbitmq-secret
  grafanaSecretName: grafana-secret

  jwtSecret: dev-jwt-secret-change-me
  postgresPassword: postgres
  rabbitmqPassword: guest
  grafanaAdminPassword: admin-change-me

  s3AccessKeyId: ""
  s3SecretAccessKey: ""

postgres:
  host: postgres-master
  port: 5432
  db: app
  user: postgres
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard

rabbitmq:
  host: rabbitmq
  port: 5672
  user: guest
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard

redis:
  host: redis
  port: 6379

storage:
  pvcName: uploads-pvc
  size: 10Gi
  storageClassName: standard

grafana:
  adminUser: admin
  domain: video-platform.local
  rootUrl: http://video-platform.local/grafana/
  csrfTrustedOrigins: http://video-platform.local
  anonymous:
    enabled: false
    orgRole: Viewer
  loginForm:
    disabled: false

prometheus:
  retention: 7d

loki:
  retention: 168h