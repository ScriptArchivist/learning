apiVersion: v1
kind: ConfigMap
metadata:
  name: origin-nginx-config
  namespace: video-platform
data:
  nginx.conf: |
{{ .Files.Get "nginx.conf" | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: origin
  namespace: video-platform
spec:
  selector:
    app: origin
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origin
  namespace: video-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: origin
  template:
    metadata:
      labels:
        app: origin
    spec:
      containers:
        - name: origin
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: uploads
              mountPath: /app/uploads
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
      volumes:
        - name: nginx-config
          configMap:
            name: origin-nginx-config
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}