apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: video-platform
type: Opaque
stringData:
  POSTGRESQL_POSTGRES_PASSWORD: {{ .Values.postgres.password }}
  POSTGRESQL_USERNAME: {{ .Values.postgres.user }}
  POSTGRESQL_PASSWORD: {{ .Values.postgres.password }}
  POSTGRESQL_DATABASE: {{ .Values.postgres.db }}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-master
  namespace: video-platform
spec:
  selector:
    app: postgres-master
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-master
  namespace: video-platform
spec:
  serviceName: postgres-master
  replicas: 1
  selector:
    matchLabels:
      app: postgres-master
  template:
    metadata:
      labels:
        app: postgres-master
    spec:
      containers:
        - name: postgres
          image: bitnami/postgresql:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_POSTGRES_PASSWORD
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_USERNAME
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_DATABASE
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi