apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: upload-service
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret

{{- if eq .Values.app.storageType "local" }}
      initContainers:
        - name: prepare-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads /app/uploads/live /app/uploads/hls /app/uploads/original /app/uploads/thumbs
              chmod -R 777 /app/uploads || true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
{{- end }}

      containers:
        - name: upload-service
          image: {{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              uvicorn src.upload_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          envFrom:
            - configMapRef:
                name: video-platform-config
            - secretRef:
                name: {{ .Values.secrets.appSecretName }}
          env:
            - name: SERVICE_NAME
              value: upload-service
{{- if eq .Values.app.storageType "local" }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
{{- end }}
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

{{- if eq .Values.app.storageType "local" }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}
{{- end }}