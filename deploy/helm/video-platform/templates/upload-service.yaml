apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: video-platform
spec:
  type: ClusterIP
  selector:
    app: upload-service
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: video-platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      initContainers:
        - name: prepare-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads /app/uploads/live /app/uploads/hls /app/uploads/original /app/uploads/thumbs
              chmod -R 777 /app/uploads || true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: upload-service
          image: {{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              uvicorn src.upload_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          env:
            - name: SERVICE_NAME
              value: upload-service
            - name: database_write_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: database_read_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: secret_key
              value: super-secret-key-change-me
            - name: access_token_expire_minutes
              value: "30"
            - name: STORAGE_PATH
              value: /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}