apiVersion: v1
kind: Service
metadata:
  name: outbox-publisher
  namespace: video-platform
spec:
  type: ClusterIP
  selector:
    app: outbox-publisher
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: video-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      containers:
        - name: outbox-publisher
          image: {{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - python
            - -m
            - src.outbox_publisher
          env:
            - name: SERVICE_NAME
              value: outbox-publisher
            - name: METRICS_PORT
              value: "9100"
            - name: database_write_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: database_read_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: RABBIT_URL
              value: amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@rabbitmq:5672/
            - name: OUTBOX_BATCH_SIZE
              value: "50"
            - name: OUTBOX_POLL_INTERVAL
              value: "0.5"
            - name: OUTBOX_LEADER_LOCK_KEY
              value: "424242"
            - name: OUTBOX_LEADER_REFRESH_SECONDS
              value: "2.0"
          ports:
            - containerPort: 9100
              name: metrics