apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: video-platform
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts-cloud.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets:
              - prometheus:9090

      - job_name: frontend
        metrics_path: /api/metrics
        static_configs:
          - targets:
              - frontend:3001

      - job_name: identity-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - identity-service:8000

      - job_name: upload-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - upload-service:8000

      - job_name: video-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - video-api:8000

      - job_name: processing-worker
        metrics_path: /metrics
        static_configs:
          - targets:
              - processing-worker:9100

      - job_name: outbox-publisher
        metrics_path: /metrics
        static_configs:
          - targets:
              - outbox-publisher:9100

      - job_name: video-events-consumer
        metrics_path: /metrics
        static_configs:
          - targets:
              - video-events-consumer:9100

      - job_name: rabbitmq
        static_configs:
          - targets:
              - rabbitmq:15692

      - job_name: postgres-exporter
        static_configs:
          - targets:
              - postgres-exporter:9187

      - job_name: loki
        metrics_path: /metrics
        static_configs:
          - targets:
              - loki:3100

      - job_name: alertmanager
        metrics_path: /metrics
        static_configs:
          - targets:
              - alertmanager:9093

  alerts-cloud.yml: |
    groups:
      - name: cloud-service-health
        rules:
          - alert: CloudServiceDown
            expr: up{job=~"frontend|identity-service|upload-service|video-api|processing-worker|outbox-publisher|video-events-consumer|rabbitmq|postgres-exporter"} == 0
            for: 1m
            labels:
              severity: critical
              category: availability
            annotations:
              summary: {{ `"Cloud service down: {{ $labels.job }}"` }}
              description: {{ `"Target {{ $labels.instance }} for job {{ $labels.job }} has been down for 1 minute."` }}

      - name: cloud-api-symptoms
        rules:
          - alert: CloudApiHigh5xxRate
            expr: |
              (
                sum by (service) (rate(app_http_requests_total{service=~"upload-service|video-api|identity-service",status=~"5.."}[5m]))
                /
                clamp_min(sum by (service) (rate(app_http_requests_total{service=~"upload-service|video-api|identity-service"}[5m])), 0.001)
              ) > 0.05
            for: 3m
            labels:
              severity: warning
              category: api
            annotations:
              summary: {{ `"High 5xx rate: {{ $labels.service }}"` }}
              description: "5xx ratio is above 5% for 3 minutes."

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: video-platform
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: video-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.external-url=/prometheus
            - --web.route-prefix=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts-cloud.yml
              subPath: alerts-cloud.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config