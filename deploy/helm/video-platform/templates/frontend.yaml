apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: video-platform
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 3001
      targetPort: 3001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: video-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              npm ci && npm run dev -- -p 3001
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://{{ .Values.ingress.host }}
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 40