apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: video-platform
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: video-platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: {{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              uvicorn identity.src.main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log
          env:
            - name: SERVICE_NAME
              value: identity-service
            - name: database_write_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: database_read_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: secret_key
              value: super-secret-key-change-me
            - name: access_token_expire_minutes
              value: "30"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20