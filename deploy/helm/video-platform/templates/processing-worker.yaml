apiVersion: v1
kind: Service
metadata:
  name: processing-worker
  namespace: video-platform
spec:
  type: ClusterIP
  selector:
    app: processing-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: video-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-worker
  template:
    metadata:
      labels:
        app: processing-worker
    spec:
      initContainers:
        - name: prepare-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads /app/uploads/original /app/uploads/hls /app/uploads/thumbs /app/uploads/thumbnails
              chmod -R 777 /app/uploads || true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: processing-worker
          image: {{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - python
            - -m
            - src.worker
          env:
            - name: SERVICE_NAME
              value: processing-worker
            - name: METRICS_PORT
              value: "9100"
            - name: database_write_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: database_read_url
              value: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-master:5432/{{ .Values.postgres.db }}
            - name: RABBIT_URL
              value: amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@rabbitmq:5672/
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: VIDEO_LOCK_TTL_SECONDS
              value: "3600"
            - name: STORAGE_PATH
              value: /app/uploads
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}