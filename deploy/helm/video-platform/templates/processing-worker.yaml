apiVersion: v1
kind: Service
metadata:
  name: processing-worker
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: processing-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-worker
  template:
    metadata:
      labels:
        app: processing-worker
    spec:
      initContainers:
        - name: prepare-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads /app/uploads/original /app/uploads/hls /app/uploads/thumbs /app/uploads/thumbnails
              chmod -R 777 /app/uploads || true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: processing-worker
          image: {{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - python
            - -m
            - src.worker
          envFrom:
            - configMapRef:
                name: video-platform-config
            - secretRef:
                name: {{ .Values.secrets.appSecretName }}
          env:
            - name: SERVICE_NAME
              value: processing-worker
            - name: METRICS_PORT
              value: "9100"
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}