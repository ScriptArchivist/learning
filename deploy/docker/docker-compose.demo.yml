services:
  db-master:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: app
    volumes:
      - postgres_master_data:/bitnami/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    build:
      context: ../../
      dockerfile: app/backend/Dockerfile
    command: >
      sh -c "echo 'Waiting for database...' && alembic upgrade head"
    depends_on:
      db-master:
        condition: service_healthy
    environment:
      database_write_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      database_read_url: postgresql+psycopg://postgres:postgres@db-master:5432/app

  identity-service:
    build:
      context: ../../
      dockerfile: app/backend/Dockerfile
    command: >
      sh -c "echo 'Starting identity-service...' && uvicorn identity.src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8000"
    environment:
      SERVICE_NAME: identity-service
      database_write_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      database_read_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      secret_key: changeme
      access_token_expire_minutes: "30"

  web:
    build:
      context: ../../
      dockerfile: app/backend/Dockerfile
    command: >
      sh -c "echo 'Starting API...' && uvicorn src.main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log"
    depends_on:
      db-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: web
      database_write_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      database_read_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_HTTP_SCHEME: ${PUBLIC_HTTP_SCHEME:-http}
      PUBLIC_HTTP_PORT: ${PUBLIC_HTTP_PORT:-8080}
      PUBLIC_RTMP_PORT: ${PUBLIC_RTMP_PORT:-1935}
      DELIVERY_MODE: ${DELIVERY_MODE:-local}
      DELIVERY_BASE_URL: ${DELIVERY_BASE_URL:-http://origin}
      DELIVERY_PUBLIC_BASE_URL: ${DELIVERY_PUBLIC_BASE_URL}
      REDIS_URL: redis://redis:6379/0
      VIDEO_LOCK_TTL_SECONDS: "3600"
      HLS_TOKEN_SECRET: ${HLS_TOKEN_SECRET}
      HLS_TOKEN_TTL_SECONDS: ${HLS_TOKEN_TTL_SECONDS:-300}
      LIVE_RTMP_URL_TEMPLATE: ${LIVE_RTMP_URL_TEMPLATE}
      LIVE_HLS_URL_TEMPLATE: ${LIVE_HLS_URL_TEMPLATE}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}
    volumes:
      - uploads_data:/app/uploads

  video-api:
    build:
      context: ../../
      dockerfile: app/backend/Dockerfile
    command: >
      sh -c "echo 'Starting video-api...' && uvicorn src.video_api_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log"
    depends_on:
      db-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8003:8000"
    environment:
      SERVICE_NAME: video-api
      database_write_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      database_read_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      secret_key: changeme
      access_token_expire_minutes: "30"
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_HTTP_SCHEME: ${PUBLIC_HTTP_SCHEME:-http}
      PUBLIC_HTTP_PORT: ${PUBLIC_HTTP_PORT:-8080}
      PUBLIC_RTMP_PORT: ${PUBLIC_RTMP_PORT:-1935}
      DELIVERY_MODE: "url"
      DELIVERY_PUBLIC_BASE_URL: ${DELIVERY_PUBLIC_BASE_URL}
      DELIVERY_BASE_URL: ${DELIVERY_BASE_URL:-http://origin}

  upload-service:
    build:
      context: ../../
      dockerfile: app/backend/Dockerfile.upload
    command: >
      sh -c "echo 'Starting upload-service...' && uvicorn src.upload_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log"
    depends_on:
      db-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8002:8000"
    environment:
      SERVICE_NAME: upload-service
      database_write_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      database_read_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      secret_key: changeme
      access_token_expire_minutes: "30"
      STORAGE_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads

  processing-worker:
    build:
      context: ../../
      dockerfile: app/backend/Dockerfile.worker
    command: python -m src.worker
    depends_on:
      db-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SERVICE_NAME: processing-worker
      METRICS_PORT: "9100"
      database_write_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      database_read_url: postgresql+psycopg://postgres:postgres@db-master:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      VIDEO_LOCK_TTL_SECONDS: "3600"
    expose:
      - "9100"
    volumes:
      - uploads_data:/app/uploads

  origin:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      web:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus-demo.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      web:
        condition: service_started
      upload-service:
        condition: service_started
      video-api:
        condition: service_started
      processing-worker:
        condition: service_started
      alertmanager:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ../../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    expose:
      - "9100"

volumes:
  postgres_master_data:
  uploads_data:
  grafana_data:
  loki_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1