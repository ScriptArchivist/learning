[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access,worker,broker,outbox-publisher,pika,pika.adapters

[handlers]
keys=console

[formatters]
keys=std

[filters]
keys=correlation

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=console
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=console
propagate=0
qualname=uvicorn.access

; --- ДОБАВЛЕНО: worker ---
[logger_worker]
level=INFO
handlers=console
propagate=0
qualname=worker

; --- ДОБАВЛЕНО: broker ---
[logger_broker]
level=INFO
handlers=console
propagate=0
qualname=broker

; --- ДОБАВЛЕНО: outbox-publisher ---
[logger_outbox-publisher]
level=INFO
handlers=console
propagate=0
qualname=outbox-publisher

[handler_console]
class=StreamHandler
level=INFO
formatter=std
filters=correlation
args=(sys.stdout,)

[formatter_std]
format=%(asctime)s %(levelname)s [%(name)s] rid=%(request_id)s tid=%(trace_id)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[filter_correlation]
class=service.logging_filter.CorrelationFilter

; --- глушим шум Pika ---
[logger_pika]
level=CRITICAL
handlers=
qualname=pika
propagate=0

[logger_pika.adapters]
level=CRITICAL
handlers=
qualname=pika.adapters
propagate=0