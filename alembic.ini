# alembic.ini
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# ВАЖНО: для локальной разработки с PostgreSQL в Docker
sqlalchemy.url = postgresql://video:video123@localhost:5432/video_platform

# или если используешь креды из docker-compose.ci.yml:
# sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/app

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S