deploy-vps-helm:
  stage: deploy
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  environment:
    name: production
    url: http://$PROD_DOMAIN
  before_script:
    - apk add --no-cache kubectl bash coreutils
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl config use-context default
    - kubectl get nodes
  script:
    - kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

    - kubectl -n "$KUBE_NAMESPACE" create secret docker-registry gitlab-registry-secret --docker-server="$CI_REGISTRY" --docker-username="$REGISTRY_PULL_USER" --docker-password="$REGISTRY_PULL_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl -n "$KUBE_NAMESPACE" get secret gitlab-registry-secret
    - kubectl -n "$KUBE_NAMESPACE" patch serviceaccount default -p '{"imagePullSecrets":[{"name":"gitlab-registry-secret"}]}'

    - kubectl -n "$KUBE_NAMESPACE" delete job migrate --ignore-not-found=true

    - |
      helm upgrade --install "$HELM_RELEASE" deploy/helm/video-platform \
        --namespace "$KUBE_NAMESPACE" \
        --create-namespace \
        --values deploy/helm/values-prod.yaml \
        --set global.namespace="$KUBE_NAMESPACE" \
        --set global.domain="$PROD_DOMAIN" \
        --set global.publicBaseUrl="http://$PROD_DOMAIN" \
        --set global.mediaBaseUrl="http://$PROD_DOMAIN" \
        --set ingress.host="$PROD_DOMAIN" \
        --set ingress.className=traefik \
        --set ingress.tls.enabled=false \
        --set secrets.create=true \
        --set secrets.jwtSecret="$JWT_SECRET" \
        --set secrets.postgresPassword="$POSTGRES_PASSWORD" \
        --set secrets.rabbitmqPassword="$RABBITMQ_PASSWORD" \
        --set secrets.grafanaAdminPassword="$GRAFANA_ADMIN_PASSWORD" \
        --set grafana.domain="$PROD_DOMAIN" \
        --set grafana.rootUrl="http://$PROD_DOMAIN/grafana/" \
        --set grafana.csrfTrustedOrigins="http://$PROD_DOMAIN" \
        --set image.backend.repository="$CI_REGISTRY_IMAGE/backend" \
        --set image.backend.tag="$CI_COMMIT_SHORT_SHA" \
        --set image.worker.repository="$CI_REGISTRY_IMAGE/worker" \
        --set image.worker.tag="$CI_COMMIT_SHORT_SHA" \
        --timeout 10m

    - kubectl -n "$KUBE_NAMESPACE" get pods
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "feature/deploy"'

smoke-vps-helm:
  stage: smoke
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl kubectl bash
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl config use-context default

  script:
    # Pods
    - kubectl -n "$KUBE_NAMESPACE" get pods

    # Rollouts
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/video-api --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/upload-service --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/web --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/processing-worker --timeout=180s

    # Internal API checks
    - kubectl -n "$KUBE_NAMESPACE" port-forward svc/video-api 18080:8000 >/tmp/video-api.log 2>&1 &
    - kubectl -n "$KUBE_NAMESPACE" port-forward svc/upload-service 18081:8000 >/tmp/upload-api.log 2>&1 &
    - kubectl -n "$KUBE_NAMESPACE" port-forward svc/web 18082:8000 >/tmp/web.log 2>&1 &
    - sleep 10

    # Health
    - curl -fsS "http://127.0.0.1:18080/health"
    - curl -fsS "http://127.0.0.1:18081/health"

    # OpenAPI
    - curl -fsS "http://127.0.0.1:18080/openapi.json"
    - curl -fsS "http://127.0.0.1:18082/openapi.json"

    # Worker boot validation
    - kubectl -n "$KUBE_NAMESPACE" logs deploy/processing-worker --tail=50 | grep "consumer started"

    # RabbitMQ validation
    - kubectl -n "$KUBE_NAMESPACE" logs deploy/outbox-publisher --tail=50 | grep "leader lock acquired"

    # S3 env validation
    - kubectl -n "$KUBE_NAMESPACE" exec deploy/upload-service -- env | grep STORAGE_TYPE=s3
    - kubectl -n "$KUBE_NAMESPACE" exec deploy/upload-service -- env | grep S3_ENDPOINT_URL

    # Ingress external checks
    - curl -fsS "http://$PROD_DOMAIN/api/upload/health"
    - curl -fsS "http://$PROD_DOMAIN/api/video/health"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "feature/deploy"'