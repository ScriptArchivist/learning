run-tests:
  stage: test
  image: docker:latest
  services:
    - docker:dind

  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker-compose version

  script:
    - echo "Поднимаем инфраструктуру для тестов"
    # Поднимаем только сервис базы данных
    - docker-compose -f docker-compose.ci.yml up -d db
    # Применяем миграции
    - docker-compose -f docker-compose.ci.yml run --rm migrate
    # Запускаем интеграционные тесты, игнорируем ошибки если тестов нет
    - echo "Запускаем интеграционные тесты"
    - docker-compose -f docker-compose.ci.yml run --rm web sh -c "pytest tests || echo 'Нет тестов, пропускаем'"

  after_script:
    - docker-compose -f docker-compose.ci.yml down -v

  rules:
    - if: '$CI_COMMIT_BRANCH'
