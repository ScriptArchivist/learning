# .ci/build.yml
build-docker-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind

  variables:
    DOCKER_TLS_CERTDIR: ""  # отключаем TLS для docker-in-docker

  before_script:
    - echo "Логинимся в GitLab Container Registry"
    # CI_REGISTRY_USER = gitlab-ci-token
    # CI_REGISTRY_PASSWORD = Project Access Token (созданный в Settings → Access Tokens)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker info

  script:
    - echo "Собираем Docker образ с тегом commit"
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "Тегаем как latest"
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - echo "Пушим Docker образы в GitLab Registry"
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

  only:
    - master
