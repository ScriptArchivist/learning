# .ci/build.yml
build-docker-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    # Явно указываем переменные для Registry
    REGISTRY_URL: "registry.gitlab.com"
    REGISTRY_USER: "$GITLAB_REGISTRY_USER"  # Ваш username
    REGISTRY_TOKEN: "$GITLAB_REGISTRY_TOKEN"  # Personal access token
    REGISTRY_IMAGE: "$REGISTRY_URL/$CI_PROJECT_PATH"

  before_script:
    - |
      echo "=== Настройка аутентификации ==="
      echo ""
      
      # Проверяем наличие токена
      if [ -z "$REGISTRY_TOKEN" ]; then
        echo "❌ ERROR: REGISTRY_TOKEN не установлен"
        echo "Создайте Personal Access Token с scopes: api, write_registry, read_registry"
        echo "Добавьте его в Settings → CI/CD → Variables как GITLAB_REGISTRY_TOKEN"
        exit 1
      fi
      
      # Логинимся с Personal Access Token
      echo "Логинимся в GitLab Container Registry..."
      echo "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY_URL"
      
      # Проверяем успешность
      if [ $? -eq 0 ]; then
        echo "✅ Успешный вход в $REGISTRY_URL"
        echo "   Пользователь: $REGISTRY_USER"
      else
        echo "❌ Ошибка входа"
        echo "   Проверьте:"
        echo "   1. Токен не истек"
        echo "   2. Токен имеет scope write_registry"
        echo "   3. Правильный username"
        exit 1
      fi

  script:
    - |
      echo ""
      echo "=== Сборка Docker образа ==="
      
      # 1. Тестовый образ (для проверки)
      echo "1. Тестовый образ..."
      docker pull alpine:latest
      docker tag alpine:latest "$REGISTRY_IMAGE:test-access"
      
      echo "   Пробуем тестовый пуш..."
      if docker push "$REGISTRY_IMAGE:test-access" 2>&1 | grep -q "digest:"; then
        echo "   ✅ Тестовый пуш успешен"
        docker rmi "$REGISTRY_IMAGE:test-access"
      else
        echo "   ❌ Тестовый пуш не удался"
        exit 1
      fi
      
      # 2. Сборка основного образа
      echo ""
      echo "2. Собираем основной образ..."
      docker build -t "$REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
      
      echo ""
      echo "3. Добавляем тег latest..."
      docker tag "$REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$REGISTRY_IMAGE:latest"
      
      # 3. Пуш основного образа
      echo ""
      echo "4. Пушим основной образ..."
      docker push "$REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      
      echo ""
      echo "5. Пушим тег latest..."
      docker push "$REGISTRY_IMAGE:latest"
      
      echo ""
      echo "✅ Все образы успешно запушены!"

  only:
    - master