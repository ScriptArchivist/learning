# .ci/build.yml
build-docker-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind

  variables:
    DOCKER_TLS_CERTDIR: ""  # отключаем TLS для dind

  before_script:
    - |
      echo "=== Детальная проверка доступа ==="
      echo ""
      
      # 1. Проверяем наличие всех переменных
      echo "1. Переменные окружения:"
      echo "   CI_PROJECT_ID: $CI_PROJECT_ID"
      echo "   CI_PROJECT_PATH: $CI_PROJECT_PATH"
      echo "   CI_REGISTRY: $CI_REGISTRY"
      echo "   CI_REGISTRY_IMAGE: $CI_REGISTRY_IMAGE"
      echo "   CI_REGISTRY_USER: $CI_REGISTRY_USER"
      echo "   CI_JOB_TOKEN exists: $(if [ -n "$CI_JOB_TOKEN" ]; then echo 'YES (${#CI_JOB_TOKEN} chars)'; else echo 'NO'; fi)"
      
      # 2. Проверяем права проекта на registry
      echo ""
      echo "2. Проверка прав проекта в Registry..."
      RESPONSE=$(curl -s -I -H "Authorization: Bearer $CI_JOB_TOKEN" \
        "https://$CI_REGISTRY/v2/$CI_PROJECT_PATH/tags/list?n=1")
      
      echo "   HTTP Status: $(echo "$RESPONSE" | head -1)"
      
      if echo "$RESPONSE" | grep -q "200 OK"; then
        echo "   ✅ Проект имеет доступ на чтение к Registry"
      elif echo "$RESPONSE" | grep -q "401\|403"; then
        echo "   ❌ Проект НЕ имеет доступа к Registry"
      fi
      
      # 3. Детальная проверка docker login
      echo ""
      echo "3. Тест Docker аутентификации..."
      if docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY" 2>&1 | grep -q "Login Succeeded"; then
        echo "   ✅ Docker login успешен"
        
        # Проверяем сохраненные credentials
        echo "   Проверка конфига Docker..."
        cat /root/.docker/config.json | jq -r '.auths | keys[]' || true
      else
        echo "   ❌ Docker login не удался"
        docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY" || true
      fi

  script:
    - |
      echo ""
      echo "=== Сборка Docker образа ==="
      
      # 1. Сборка с уменьшенным размером для теста
      echo "1. Собираем тестовый образ..."
      
      # Создаем минимальный Dockerfile для теста
      cat > Dockerfile.test << EOF
      FROM alpine:latest
      RUN echo "Test image built at $(date)" > /built.txt
      CMD cat /built.txt
      EOF
      
      # Собираем тестовый образ
      docker build -f Dockerfile.test -t "$CI_REGISTRY_IMAGE:test-push" .
      
      # 2. Пробуем запушить тестовый образ
      echo ""
      echo "2. Тестовый пуш маленького образа..."
      if docker push "$CI_REGISTRY_IMAGE:test-push" 2>&1; then
        echo "   ✅ Тестовый пуш успешен"
        echo "   Пробуем основной образ..."
      else
        echo "   ❌ Тестовый пуш не удался"
        echo "   Проблема в правах доступа, не в размере образа"
        exit 1
      fi
      
      # 3. Сборка основного образа
      echo ""
      echo "3. Собираем основной образ..."
      docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
      docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
      
      # 4. Пуш основного образа
      echo ""
      echo "4. Пушим основной образ..."
      echo "   Тег: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      
      # Пуш с подробным выводом
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" 2>&1 | while read line; do
        echo "   $line"
      done
      
      echo ""
      echo "5. Пушим тег latest..."
      docker push "$CI_REGISTRY_IMAGE:latest" 2>&1 | tail -5

  after_script:
    - |
      echo ""
      echo "=== Детальная диагностика ==="
      echo "Docker images:"
      docker images "$CI_REGISTRY_IMAGE*"
      
      echo ""
      echo "Проверка network доступности Registry..."
      timeout 5 curl -v "https://$CI_REGISTRY/v2/" 2>&1 | grep -A5 "HTTP\|CONNECT"
      
      echo ""
      echo "Проверка конфигурации Docker daemon..."
      docker info 2>&1 | grep -i "registry\|insecure"

  only:
    - master