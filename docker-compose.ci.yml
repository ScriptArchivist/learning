version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  migrate:
    build: .
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head
      "
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
    volumes:
      - ./src:/app/src
      - ./db:/app/db
      - ./model:/app/model
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  web:
    build: .
    command: >
      sh -c "
        echo 'Applying migrations...' &&
        alembic upgrade head &&
        echo 'Starting API...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000
      "
    depends_on:
      - db
      - migrate
      - rabbitmq
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      # RABBIT_QUEUE: video.process
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - uploads_data:/app/uploads

  worker:
    build: .
    command: python -m src.worker
    depends_on:
      - db
      - rabbitmq
      - migrate
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      # RABBIT_QUEUE: video.process
    volumes:
      - ./src:/app/src
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
