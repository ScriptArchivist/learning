version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s  # Даем время на запуск

  migrate:
    build: .
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        # Используем Python для надежной проверки
        python -c '
          import time, sys, os
          from psycopg2 import connect
          from psycopg2.errors import OperationalError
          
          url = os.environ.get(\"DATABASE_URL\")
          for i in range(30):
            try:
              conn = connect(url)
              conn.close()
              print(\"✓ Database is ready!\")
              sys.exit(0)
            except OperationalError:
              if i < 29:
                print(f\"Attempt {i+1}/30: Waiting for database...\")
                time.sleep(1)
              else:
                print(\"✗ Database not available after 30 seconds\")
                sys.exit(1)
        ' &&
        echo 'Running migrations...' &&
        alembic upgrade head
      "
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app

  web:
    build: .
    command: >
      sh -c "
        echo 'Starting web server...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000
      "
    depends_on:
      migrate:
        condition: service_completed_successfully  # Ключевое изменение
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
    # Только для разработки:
    # volumes:
    #   - ./src:/app/src

volumes:
  postgres_data: