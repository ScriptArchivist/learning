version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    build: .
    command: >
      sh -c "echo 'Waiting for database...' && alembic upgrade head"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
    volumes:
      - ./src:/app/src
      - ./db:/app/db
      - ./model:/app/model
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  # Legacy / origin-facing API:
  # upload + file/hls/thumb + share/watch etc
  web:
    build: .
    command: >
      sh -c "echo 'Starting API...' && uvicorn src.main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      AUTH_STUB: "1"

      DELIVERY_MODE: ${DELIVERY_MODE:-local}
      DELIVERY_BASE_URL: ${DELIVERY_BASE_URL:-http://origin}
      DELIVERY_PUBLIC_BASE_URL: ${DELIVERY_PUBLIC_BASE_URL:-http://localhost:8080}

      REDIS_URL: redis://redis:6379/0
      VIDEO_LOCK_TTL_SECONDS: "3600"

      HLS_TOKEN_SECRET: ${HLS_TOKEN_SECRET:-super-long-random-secret-1234567890}
      HLS_TOKEN_TTL_SECONDS: ${HLS_TOKEN_TTL_SECONDS:-300}

      LIVE_RTMP_URL_TEMPLATE: "rtmp://localhost:1935/live/{stream_key}"
      LIVE_HLS_URL_TEMPLATE: "http://localhost:8080/live/{stream_key}/master.m3u8"

      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:\d+)?$}

    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./logging.ini:/app/logging.ini
      - uploads_data:/app/uploads

  # ✅ Video API for Flutter (metadata + playback only)
  # ВАЖНО: delivery=url => не лезем в /app/uploads, отдаём публичные HLS URL через origin/nginx
  video-api:
    build: .
    command: >
      sh -c "echo 'Starting video-api...' && uvicorn src.video_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      AUTH_STUB: "1"

      # ✅ video-api stateless: только публичные ссылки на origin (nginx)
      DELIVERY_MODE: "url"
      DELIVERY_PUBLIC_BASE_URL: ${DELIVERY_PUBLIC_BASE_URL:-http://localhost:8080}

      # необязательно, но пусть будет консистентно
      DELIVERY_BASE_URL: ${DELIVERY_BASE_URL:-http://origin}
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./logging.ini:/app/logging.ini

  # ✅ Consumer доменных событий для обновления статусов в БД
  # (UPLOAD_COMPLETED, PROCESSING_*)
  video-events-consumer:
    build: .
    command: python -m src.video_events_consumer
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/

      RABBIT_EVENTS_EXCHANGE: ${RABBIT_EVENTS_EXCHANGE:-video.events.x}
      RABBIT_EVENTS_QUEUE: ${RABBIT_EVENTS_QUEUE:-events.q}
      RABBIT_EVENTS_ROUTING_KEY: ${RABBIT_EVENTS_ROUTING_KEY:-video.events}
    volumes:
      - ./src:/app/src
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - ./logging.ini:/app/logging.ini

  # Upload microservice (если ты реально его используешь отдельно)
  upload-service:
    build:
      context: .
      dockerfile: Dockerfile.upload
    command: >
      sh -c "echo 'Starting upload-service...' && uvicorn src.upload_main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.ini --access-log"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      AUTH_STUB: "1"
      STORAGE_PATH: /app/uploads
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./logging.ini:/app/logging.ini
      - uploads_data:/app/uploads

  ingest:
    build: ./ingest
    ports:
      - "1935:1935"
    volumes:
      - uploads_data:/app/uploads
      - ./ingest/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ingest/scripts:/opt/scripts:ro
    command: >
      sh -lc "mkdir -p /app/uploads/live && chmod -R 0777 /app/uploads && nginx -g 'daemon off;'"

  processing-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m src.worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      VIDEO_LOCK_TTL_SECONDS: "3600"
    volumes:
      - ./logging.ini:/app/logging.ini
      - ./src:/app/src
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model
      - uploads_data:/app/uploads

  outbox-publisher:
    build: .
    command: python -m src.outbox_publisher
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      OUTBOX_BATCH_SIZE: "50"
      OUTBOX_POLL_INTERVAL: "0.5"
      OUTBOX_LEADER_LOCK_KEY: "424242"
    volumes:
      - ./src:/app/src
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model

  dlq-replayer:
    build: .
    command: python -m src.dlq_replayer
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      DLQ_REPLAY_LIMIT: "200"
      DLQ_RESET_ATTEMPTS: "1"
    volumes:
      - ./src:/app/src
      - ./service:/app/service
      - ./db:/app/db
      - ./model:/app/model

  live-cleaner:
    build: .
    command: python -m src.live_ttl_cleaner
    depends_on:
      web:
        condition: service_started
    environment:
      STORAGE_PATH: /app/uploads
      LIVE_TTL_MINUTES: ${LIVE_TTL_MINUTES:-30}
      LIVE_TTL_INTERVAL_SECONDS: ${LIVE_TTL_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src:/app/src
      - uploads_data:/app/uploads

  origin:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  uploads_data: