global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts-cloud.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity-service:8000

  - job_name: upload-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - upload-service:8000

  - job_name: video-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - video-api:8000

  - job_name: processing-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - processing-worker:9100

  - job_name: outbox-publisher
    metrics_path: /metrics
    static_configs:
      - targets:
          - outbox-publisher:9100

  - job_name: video-events-consumer
    metrics_path: /metrics
    static_configs:
      - targets:
          - video-events-consumer:9100

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187