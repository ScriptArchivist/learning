global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8000

  - job_name: upload-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - upload-service:8000

  - job_name: video-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - video-api:8000

  - job_name: processing-worker
    static_configs:
      - targets:
          - processing-worker:9100

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692